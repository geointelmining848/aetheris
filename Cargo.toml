[package]
name = "aetheris"
version = "0.1.0"
edition = "2024"
description = "Aetheris — a standalone, ultra-lightweight, versatile cross-platform text editor written in pure Rust for Windows, macOS, and Linux."
license = "MIT"
repository = "https://github.com/geointelmining848/aetheris"
readme = "README.md"
keywords = ["text-editor", "editor", "cross-platform", "rust", "iced"]
categories = ["text-editors", "development-tools"]

[dependencies]
# Native GPU/CPU cross-platform GUI (zero WebView, zero external runtime)
iced = { version = "0.14.0", features = ["tokio", "highlighter", "markdown", "advanced"] }

# High-performance text & large-file engines
ropey = "1.6.1"
memmap2 = "0.9.12"

# Character encoding & line-ending mastery
encoding_rs = "0.8.44"
chardetng = "1.0.0"

# Ripgrep-class search & regex
ignore = "0.4.35"
regex = "1.13.2"

# Diff engine
similar = { version = "3.2.1", features = ["inline", "unicode"] }

# Native OS file dialogs & platform config paths
rfd = "0.18.0"
dirs = "7.0.0"

# Serialization, formatting & developer transforms
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
quick-xml = "0.42.0"
csv = "1.4.0"
base64 = "0.23.1"
sha2 = "0.11.2"
md-5 = "0.11.0"
hex = "0.4.3"
urlencoding = "2.1.3"
html-escape = "0.3.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
